services:
  - type: web
    name: social-media-mother
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://socialmediamother.onrender.com
      - key: CLIENT_ORIGIN
        value: https://socialmediamother.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: ALLOW_MEMORY_STORAGE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: ANALYTICS_TEAM_EMAIL
        value: businessalisuleman@gmail.com
      - key: ANALYTICS_TEAM_PASSWORD_HASH
        sync: false
      # FUTURE OWNER: add values from their own AWS account in the Render
      # Dashboard under Service > Environment. `sync: false` deliberately keeps
      # secrets blank in Git. Never use or commit AWS root-account credentials.
      # AWS_REGION is for SES/SNS verification services.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SES_FROM_EMAIL
        sync: false
      - key: AWS_SNS_ORIGINATION_NUMBER
        sync: false
      # FUTURE OWNER MEDIA SETUP:
      # Deploy infra/aws-media-cdn.yaml with CAPABILITY_IAM, attach its
      # MediaApplicationManagedPolicyArn output to the application IAM identity,
      # then copy the stack outputs into these blank Render environment values:
      # AWS_S3_REGION = stack region (for example ap-southeast-1)
      # AWS_S3_BUCKET = MediaBucketName
      # MEDIA_CDN_BASE_URL = MediaCdnBaseUrl
      # AWS_CLOUDFRONT_DISTRIBUTION_ID = CloudFrontDistributionId
      # Leaving AWS_S3_BUCKET blank keeps the MongoDB GridFS fallback active.
      - key: AWS_S3_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PREFIX
        value: media
      - key: MEDIA_CDN_BASE_URL
        sync: false
      - key: AWS_CLOUDFRONT_DISTRIBUTION_ID
        sync: false
      - key: MAX_UPLOAD_MB
        value: "250"
      - key: MAX_FILES_PER_POST
        value: "20"
